name: WelcomeReward
version: 1.0.1
main: cz.tvujserver.welcomereward.WelcomeRewardPlugin
api-version: 1.20
author: Failxos
description: Reward for players who welcome a newly joined player with /welcome <nick>

commands:
  welcome:
    description: Welcome a new player and get a reward
    aliases: [w]
    permission: welcomereward.use
    usage: /<command> <nick>
  welcomereward:
    description: Manage the WelcomeReward plugin
    aliases: [wr]
    permission: welcomereward.admin
    usage: /<command> reload

permissions:
  welcomereward.use:
    description: Allows using /welcome
    default: true
  welcomereward.admin:
    description: Allows management of the WelcomeReward plugin
    default: op
