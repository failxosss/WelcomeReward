# How long (in seconds) after a new player's first join the others can type /welcome <nick>
window-seconds: 30

reward-commands:
  - "eco give %player% 100"
  # other options (uncomment and adjust for your server):
  # - "give %player% diamond 1"
  # - "exp add %player% 50"

messages:
  new-player-join: "&e%player% is on the server for the first time! Type &6/welcome %player% &ewithin &6%seconds% seconds &eto get a reward."
  rewarded: "&aThanks for welcoming &e%target%&a! You received a reward."
  usage: "&eUsage: /welcome <nick>"
  not-a-new-player: "&cThere is no new player with that name to welcome right now."
  already-welcomed: "&cYou have already welcomed this player."
  cannot-welcome-self: "&cYou can't welcome yourself."
